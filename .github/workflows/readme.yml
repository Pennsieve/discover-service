name: Sync OAS to ReadMe
on:
  push:
    branches:
      - master
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@master
        with:
          find: "https://api.pennsieve.io"
          replace: "https://api.pennsieve.io/discover"
          include: "openapi/discover-service.yml"
      - uses: readmeio/rdme@v10
        with:
          # --slug is pinned to the repo name per the Pennsieve convention
          # (slug == repo name) shared across the ReadMe-publishing repos.
          # Leaving it unset lets rdme infer the slug from the spec path, which
          # would create a SECOND definition instead of updating the live one.
          # --confirm-overwrite is required in CI (no prompt to answer).
          rdme: openapi upload openapi/discover-service.yml --key=${{ secrets.README_OAS_KEY }} --slug=discover-service --confirm-overwrite
